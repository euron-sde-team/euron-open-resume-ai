# ─────────────────────────────────────────────────────────────────────────────
# Euron Open Resume AI: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base keeps media on a volume (STORAGE=local) and sends mail straight
# to Mailpit (MAIL_MODE=smtp); the overlays switch both to S3 and SES.
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   web 3630   api 5106   postgres 5552   redis 6489   mailpit 8106 (smtp 1106)
#   floci 4657   stubs 5199
#
# The browser only ever talks to the web app: it proxies /api/* to the API
# (API_INTERNAL_URL), so the refresh cookie is first-party, exactly as behind the load
# balancer on AWS. The API port is published for curl and the integration tools.
#
# Model providers: the stack needs no key. With none configured the AI tasks run on the
# offline engine (a deterministic, heuristic one). `make demo` registers the "Stub"
# provider (apps/stubs: a deterministic OpenAI-compatible endpoint) so the real provider
# path runs too; put PROVIDER_KEYS or OPENAI_API_KEY, ANTHROPIC_API_KEY, ... in .env to
# use real models. Admins manage providers and models in the app (/admin).
#
# Memory: the worker parses and analyses resumes (PDF/DOCX text extraction, large model
# payloads), so it gets 2 GB and a 512 MB /dev/shm (the same floor as the 1 vCPU / 2 GB Fargate task in
# infra/terraform). api 1.5 GB, web 512 MB, stubs 128 MB.
# ─────────────────────────────────────────────────────────────────────────────
name: open-resume

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation under the variable's own name, so `--env-file .env.aws` (make up-aws)
# and your shell can set it; the overlays then set their own values on top. Precedence,
# highest first: an overlay's `environment:`, your shell, the last --env-file
# (.env.aws for up-aws, then .env), the default below. Keys the base does not set at
# all (S3_BUCKET, MEDIA_ORIGINS, ...) also reach the containers through the overlay's
# `env_file:`.
x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "5106"
  LOG_LEVEL: ${LOG_LEVEL:-${RESUME_LOG_LEVEL:-info}}
  PRODUCT_NAME: ${PRODUCT_NAME:-${RESUME_PRODUCT_NAME:-Euron Open Resume AI}}
  APP_WEB_URL: http://localhost:${RESUME_WEB_PORT:-3630}
  # Same origin as the web app: the browser reaches the API through the web proxy.
  PUBLIC_API_URL: http://localhost:${RESUME_WEB_PORT:-3630}
  CORS_ORIGINS: http://localhost:${RESUME_WEB_PORT:-3630}
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://resume:resume@postgres:5432/resume
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Migrations run once, in the `migrate` one-shot, before the API and worker start.
  MIGRATE_ON_BOOT: "false"
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  JWT_SECRET: ${RESUME_JWT_SECRET:?run `make env` first}
  REFRESH_SECRET: ${RESUME_REFRESH_SECRET:?run `make env` first}
  # 32 random bytes, base64: encrypts stored TOTP secrets. `make env` adds it to an
  # existing .env as well.
  TOTP_ENCRYPTION_KEY: ${RESUME_TOTP_ENCRYPTION_KEY:?run `make env` first}
  COOKIE_SECURE: "false"
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  # off disables every rate limit; leave it on except for load tests.
  RATE_LIMITS: ${RATE_LIMITS:-on}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-900}
  STORAGE: ${STORAGE:-local}
  DATA_DIR: /app/data
  MAIL_MODE: ${MAIL_MODE:-smtp}
  MAIL_FROM: ${MAIL_FROM:-${RESUME_PRODUCT_NAME:-Euron Open Resume AI} <no-reply@resume.example.test>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  # Headless Chromium for the PDF renderer (installed in the image). The container's
  # user namespace sandbox is unavailable, so Chromium's own sandbox is off; the renderer
  # blocks every request except data: and about: instead.
  CHROMIUM_PATH: /usr/bin/chromium
  CHROMIUM_NO_SANDBOX: "1"
  TEMPLATES_DIR: /app/dist/templates
  # Concurrent Chromium pages per process, and pages rendered before the browser restarts.
  PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
  PDF_RECYCLE_PAGES: ${PDF_RECYCLE_PAGES:-100}
  # Model provider keys (all optional; empty values are ignored). PROVIDER_KEYS is a
  # JSON object keyed by provider slug, e.g. {"openai":"sk-...","anthropic":"sk-ant-..."},
  # and wins over the single-key shortcuts below.
  PROVIDER_KEYS: ${PROVIDER_KEYS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  # Where providers of kind STUB (the demo's "Stub" provider) live.
  STUBS_URL: ${STUBS_URL:-http://stubs:5199}

# api, worker and migrate are one image with three commands. Each carries the same build
# so any of them can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: resume
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
    ports:
      - "127.0.0.1:${RESUME_PG_PORT:-5552}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ (the resume pipeline, exports, upkeep) and rate limits. A plain container in
  # every local setup; ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${RESUME_REDIS_PORT:-6489}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8106
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${RESUME_MAILPIT_PORT:-8106}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${RESUME_SMTP_PORT:-1106}:1025"

  # A deterministic stand-in for an OpenAI-compatible model endpoint (apps/stubs).
  # GET http://localhost:5199/__/requests lists what the API sent it.
  stubs:
    build:
      context: ../..
      dockerfile: infra/docker/stubs.Dockerfile
    image: open-resume-stubs:local
    mem_limit: 128m
    environment:
      PORT: "5199"
    ports:
      - "127.0.0.1:${RESUME_STUB_PORT:-5199}:5199"
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The API and worker wait for it.
  migrate:
    build: *api-build
    image: open-resume-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: open-resume-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/index.js"]
    # The API renders previews and exports too (headless Chromium), so it gets 1.5 GB.
    mem_limit: 1536m
    shm_size: 256m
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${RESUME_API_PORT:-5106}:5106"
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=256m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      stubs:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *api-build
    image: open-resume-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    # Parsing and analysis run here: 2 GB, like the Fargate task, and a roomy /dev/shm.
    # (PDF rendering happens in the API, which has its own Chromium.)
    mem_limit: 2g
    shm_size: 512m
    environment:
      <<: *api-env
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=512m
    # No HTTP port: the image's /up check does not apply.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      stubs:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:5106
    image: open-resume-web:local
    mem_limit: 512m
    environment:
      # Server side only: where the Next server proxies /api/*.
      API_INTERNAL_URL: http://api:5106
      PRODUCT_NAME: ${PRODUCT_NAME:-${RESUME_PRODUCT_NAME:-Euron Open Resume AI}}
    ports:
      - "127.0.0.1:${RESUME_WEB_PORT:-3630}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mediadata:
