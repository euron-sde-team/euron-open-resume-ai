# gitleaks configuration: the default ruleset plus rules for cloud identifiers
# that are not secrets on their own but must never appear in a public repo
# (they map infrastructure and aid targeted attacks).
title = "euron-open-resume-ai"

[extend]
useDefault = true

[[rules]]
id = "aws-account-id-in-arn"
description = "AWS ARN carrying a real 12-digit account id"
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:(\d{12}):'''
secretGroup = 1
keywords = ["arn:aws"]
[rules.allowlist]
regexes = ['''^000000000000$''', '''^123456789012$''']

[[rules]]
id = "aws-account-id-labelled"
description = "12-digit number labelled as an AWS account"
regex = '''(?i)(?:account[_ -]?id|aws[_ -]?account|account)["'\s:=]{1,6}(\d{12})\b'''
secretGroup = 1
keywords = ["account"]
[rules.allowlist]
# The emulator's account and the documentation placeholder
regexes = ['''^000000000000$''', '''^123456789012$''']

[[rules]]
id = "aws-resource-id"
description = "Concrete AWS resource id (AMI, subnet, security group, VPC, ...)"
regex = '''\b((?:ami|subnet|sg|vpc|pcx|rtb|igw|nat|eni|vol|snap|i)-[0-9a-f]{8,17})\b'''
secretGroup = 1
keywords = ["ami-", "subnet-", "sg-", "vpc-", "pcx-", "rtb-", "igw-", "nat-", "eni-", "vol-", "snap-", "i-"]
[rules.allowlist]
regexes = ['''-0{8,17}$''', '''-(?:x+|abc[0-9a-f]*|1234567[0-9a-f]*)$''']

[[rules]]
id = "rds-endpoint"
description = "Concrete RDS endpoint hostname"
regex = '''\b[a-z0-9-]+\.[a-z0-9]{12}\.[a-z0-9-]+\.rds\.amazonaws\.com\b'''
keywords = ["rds.amazonaws.com"]

# Everything below is allowed for a stated reason; nothing else is. A new entry needs
# a justification line like these.
[allowlist]
description = "Documented emulator credentials, test fixtures and example placeholders"
regexTarget = "match"
regexes = [
  # Floci (the local AWS emulator) accepts any credentials; the documented value is "test".
  '''AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)[=:]\s*["']?test["']?''',
  '''(access|secret)_key\s*=\s*"test"''',
  # The placeholder deploy/compose/.env.example ships; `make env` replaces it with random values.
  '''replace-with-output-of-make-env''',
  # Visibly fake secrets in unit and integration tests and in the apps/stubs tests (the
  # log-redaction and key-masking tests need a key-shaped string to prove it is masked).
  '''test-only-[A-Za-z0-9-]+''',
  '''sk-(test-canary-value|test-key-123456|secret|live-1|live-secret-abcdef|not-real|very-secret-value-0001|prod-example-key-123456|proj-abcdefghijklmnop|ant-123456789|ant-ok)''',
  # A documentation example of the PEM envelope, with no key material between the lines.
  '''-----BEGIN PRIVATE KEY-----\\n\.\.\.\\n-----END PRIVATE KEY-----''',
  # RFC 6238 style TOTP test vector used by the unit tests; not a secret.
  '''secret=ABCDEF234567''',
]
paths = [
  # Integrity hashes, not secrets.
  '''pnpm-lock\.yaml''',
  # Third-party code, never committed.
  '''(^|/)node_modules/''',
  # Env and tfvars templates hold only angle-bracket and "set-me" placeholders.
  '''(^|/)(\.env[^/]*|terraform\.tfvars)\.example$''',
]
