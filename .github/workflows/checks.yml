# Checks run on every push and pull request of Euron Open Resume AI: lint, typecheck,
# unit tests and build across every package, the API integration tests on Postgres 16
# and Redis 7, Terraform formatting and validation, the OpenAPI reference and the
# sanitization scan. The heavier pipeline (image builds, Terraform security, gitleaks,
# CodeQL, the browser end-to-end run on the local AWS emulator) lives in
# .github/workflows-full/: enable it in your fork.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit tests · build · openapi · sanitization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          CHROMIUM_NO_SANDBOX: "1"
      - run: pnpm build
      - name: OpenAPI reference matches the routes
        run: pnpm openapi --check
      - name: Sanitization scan
        run: scripts/check-sanitization.sh

  integration:
    name: integration tests (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.12-alpine
        env:
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: resume
          POSTGRES_DB: resume
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume -d resume"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      # The suite recreates this database (the name must end in _test).
      TEST_DATABASE_URL: postgres://resume:resume@localhost:5432/resume_test
      TEST_REDIS_URL: redis://localhost:6379/1
      # Hosted runners cannot grant Chromium its user-namespace sandbox.
      CHROMIUM_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  terraform:
    name: terraform fmt · validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every environment
        run: |
          for env in local-floci aws-dev aws-prod; do
            echo "== $env"
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false -no-color >/dev/null
            terraform -chdir=infra/terraform/envs/$env validate -no-color
          done
