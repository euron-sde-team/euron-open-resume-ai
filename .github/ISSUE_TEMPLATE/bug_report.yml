name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Say which role you were (member or admin) and, for AI problems, which provider and model (a real one, the local Stub, or the offline engine), plus the file type for an upload or export problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up && make demo
        2. Sign in as priya.nair@example.com, upload a resume ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: ["Local (make up on Floci)", "Local against AWS (make up-aws)", "AWS (Terraform)", "Self-hosted (other)", "Other"]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Upload and text extraction", "Resume builder and preview", "Analysis and scoring", "Improved resume and cover letter", "Interview questions, roadmap, project ideas", "Templates and PDF/DOCX export", "Models and providers", "Quotas and limits", "Account and sign-in", "Admin console (/admin)", "Email", "Deployment and infrastructure", "Other"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, tokens and hostnames before pasting.
      render: text
